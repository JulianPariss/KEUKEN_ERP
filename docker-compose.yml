services:
  erp-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${PORT}"
    environment:
      - PORT=${PORT:-9000}
    # Dokploy gestionará el proxy y los puertos, pero el mapeo en `ports`
    # es útil para desarrollo local con `docker-compose up`.
    # La variable APP_PORT se define en tu archivo .env y será el puerto
    # en el host, mientras que PORT es el puerto dentro del contenedor.
